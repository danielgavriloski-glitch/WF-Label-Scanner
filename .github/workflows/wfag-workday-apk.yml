name: WFAG Workday Test APK
on:
  push:
    branches:
      - feature/wfag-workday-start-gps-travel
      - fix/wfag-battery-stops-10min-20261111
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Validate JavaScript and tests
        run: |
          node --check app/src/main/assets/workday-core.js
          node --check app/src/main/assets/workday-ui.js
          node --check app/src/main/assets/workday-integration.js
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/v12-core.js
          node tests/workday-core.test.js
          for test in tests/*.test.js; do node "$test"; done
      - name: Build isolated test APK
        run: gradle --no-daemon :app:assembleGpsfix
      - uses: actions/upload-artifact@v4
        with:
          name: WFAG_WORKDAY_GPS_TEST_APK
          path: app/build/outputs/apk/gpsfix/app-gpsfix.apk
          if-no-files-found: error
