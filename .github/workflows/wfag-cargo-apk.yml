name: WFAG Cargo APK
on:
  push:
    branches: [feature/wfag-cargo-pickups-reminders]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Validate JS
        run: |
          for f in app/src/main/assets/cargo-*.js; do node --check "$f"; done
          for test in tests/*.test.js; do node "$test"; done
      - name: Build test APK
        run: gradle --no-daemon :app:assembleGpsfix
      - uses: actions/upload-artifact@v4
        with:
          name: WFAG_CARGO_TEST_APK
          path: app/build/outputs/apk/gpsfix/app-gpsfix.apk
          if-no-files-found: error
