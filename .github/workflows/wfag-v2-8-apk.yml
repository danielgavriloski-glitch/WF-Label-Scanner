name: Build WFAG v2.8 APK
on:
  push:
    branches:
      - feature/wfag-v2-8-edit-saved-place-names
    paths:
      - '.github/workflows/wfag-v2-8-apk.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload WFAG APK
        uses: actions/upload-artifact@v4
        with:
          name: WFAG-v2.8-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
