name: Build MBI 4.4 live work status
on:
  push:
    branches: [feature/mbi-v4-4-live-work-status]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APKs and verify report calculations
        run: gradle :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --stacktrace
      - name: Stage public signing tool for local private-key signing
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          jars = sorted((sdk/'build-tools').glob('*/lib/apksigner.jar'))
          if not jars: raise RuntimeError('apksigner.jar was not found')
          target = pathlib.Path('build/report-tools'); target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(jars[-1], target/'apksigner.jar')
          apk = pathlib.Path('app/build/outputs/apk/release/app-release-unsigned.apk')
          destination = pathlib.Path('build/report-release'); destination.mkdir(parents=True, exist_ok=True)
          parts = []
          with apk.open('rb') as source:
              index = 0
              while data := source.read(20 * 1024 * 1024):
                  name = f'app-release-unsigned.apk.part{index:02d}'
                  (destination/name).write_bytes(data)
                  parts.append({'name': name, 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
                  index += 1
          (destination/'manifest.json').write_text(json.dumps({'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(), 'parts': parts}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MBI-v4.4-release-and-tests
          path: |
            build/report-release/manifest.json
            build/report-tools/apksigner.jar
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MBI-release-part00
          path: build/report-release/app-release-unsigned.apk.part00
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MBI-release-part01
          path: build/report-release/app-release-unsigned.apk.part01
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MBI-release-part02
          path: build/report-release/app-release-unsigned.apk.part02
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MBI-release-part03
          path: build/report-release/app-release-unsigned.apk.part03
          if-no-files-found: error
      - name: Start isolated Firestore emulator
        run: |
          mkdir -p build/firestore-fixture
          curl --fail --location --retry 3 --output build/firestore-fixture/emulator.jar https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.19.8.jar
          java -jar build/firestore-fixture/emulator.jar --host 0.0.0.0 --port 8080 --project_id demo-mbi-live-status --rules tests/emulator/firestore.rules > build/firestore-fixture/emulator.log 2>&1 &
          python3 - <<'PYREADY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8080/v1/projects/demo-mbi-live-status/databases/(default)/documents/emulator_probe', timeout=1)
              except urllib.error.HTTPError as e:
                  if e.code == 404: break
              except OSError: pass
              time.sleep(1)
          else: raise RuntimeError('Firestore emulator did not start')
          PYREADY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Export examples with the real Android PDF renderer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e firestoreHost 10.0.2.2 com.mbidesign.app.next.test/mk.wf.labelscanner.ReportPreviewInstrumentation
            mkdir -p build/report-previews
            adb pull /sdcard/Android/data/com.mbidesign.app.next/files/report-previews/ build/report-previews/
            test -s build/report-previews/report-previews/MBI_Izvestaj_Primer.pdf
            test -s build/report-previews/report-previews/MBI_Pdf_Layout_Stress.pdf
            test -s build/report-previews/report-previews/CHECKS_PASSED.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MBI-report-previews
          path: build/report-previews/report-previews/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MBI-live-status-emulator-log
          path: build/firestore-fixture/emulator.log
          if-no-files-found: ignore
