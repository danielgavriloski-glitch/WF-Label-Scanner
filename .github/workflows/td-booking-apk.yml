name: Build TD Booking APK
on:
  push:
    branches: [ td-booking ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :td-booking:app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TD-Booking-v0.1-APK
          path: td-booking/app/build/outputs/apk/debug/app-debug.apk
