name: Build Workfashion Time
on:
  push:
    branches: [workfashion-personal-time]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Check attendance calculations
        run: node tests/core.test.js
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Android build
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease
          mkdir -p delivery/toolchain
          cp app/build/outputs/apk/release/app-release-unsigned.apk delivery/Workfashion_Time_v1_unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" delivery/toolchain/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" delivery/toolchain/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" delivery/toolchain/
          cp "$ANDROID_HOME/platforms/android-35/android.jar" delivery/toolchain/
      - uses: actions/upload-artifact@v4
        with:
          name: Workfashion-Time-build
          path: delivery/
          retention-days: 7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android native verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w mk.workfashion.personal.test/mk.workfashion.personal.SmokeInstrumentation > delivery/smoke.txt
            cat delivery/smoke.txt
            grep WF_SMOKE_OK delivery/smoke.txt
            adb shell screencap -p /sdcard/wf-smoke.png
            adb pull /sdcard/wf-smoke.png delivery/wf-smoke.png
            adb pull /sdcard/Android/data/mk.workfashion.personal/files/smoke-report.pdf delivery/smoke-report.pdf
            adb logcat -d > delivery/runtime.log
            if grep -q 'FATAL EXCEPTION' delivery/runtime.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Workfashion-Time-validation
          path: |
            delivery/smoke.txt
            delivery/wf-smoke.png
            delivery/smoke-report.pdf
            delivery/runtime.log
            app/build/reports/lint-results-release.html
          retention-days: 7
