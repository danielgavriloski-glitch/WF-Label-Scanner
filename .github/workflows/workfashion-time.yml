name: Build and verify WFAG 3.6
on:
  push:
    branches: [fix/wfag-hours-notifications-20261126]
    paths: ['app/**', 'tests/**', '.github/workflows/workfashion-time.yml', 'build.gradle', 'settings.gradle', 'gradle.properties']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify calculation and compatibility regressions
        run: |
          node --test tests/*.test.js
          for f in app/src/main/assets/*.js; do node --check "$f"; done
      - name: Verify full mobile UI
        run: |
          mkdir -p delivery
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/wfag-browser" playwright@1.62.1
          WFAG_PLAYWRIGHT_MODULE="$RUNNER_TEMP/wfag-browser/node_modules/playwright" WFAG_CHROME_PATH="$(command -v google-chrome)" node tests/ui-smoke.cjs
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Build Android and inspect package
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon :app:assembleStable :app:assembleDebug :app:assembleDebugAndroidTest :app:lintStable
          cp app/build/outputs/apk/stable/app-stable-unsigned.apk delivery/WFAG_3_6_0_unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" delivery/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging delivery/WFAG_3_6_0_unsigned.apk | tee delivery/package-info.txt
          grep "package: name='mk.workfashion.personal.stable' versionCode='29'" delivery/package-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 delivery/WFAG_3_6_0_unsigned.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android backup, notifications and UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w mk.workfashion.personal.test/mk.workfashion.personal.SmokeInstrumentation > delivery/smoke.txt
            cat delivery/smoke.txt
            grep WF_SMOKE_OK delivery/smoke.txt
            adb logcat -d > delivery/runtime.log
            if grep -q 'FATAL EXCEPTION' delivery/runtime.log; then exit 1; fi
            adb pull /sdcard/Android/data/mk.workfashion.personal/files/wf-smoke.png delivery/wf-smoke.png
            adb pull /sdcard/Android/data/mk.workfashion.personal/files/wf-documents.png delivery/wf-documents.png
      - name: Upload unsigned build for permanent local signing
        uses: actions/upload-artifact@v4
        with:
          name: WFAG-3-6-0-verified-unsigned
          path: |
            delivery/WFAG_3_6_0_unsigned.apk
            delivery/apksigner.jar
            delivery/package-info.txt
          retention-days: 30
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WFAG-3-6-0-validation
          path: |
            delivery/ui-smoke.png
            delivery/ui-smoke.json
            delivery/smoke.txt
            delivery/runtime.log
            delivery/wf-smoke.png
            delivery/wf-documents.png
            app/build/reports/lint-results-stable.html
          retention-days: 30
