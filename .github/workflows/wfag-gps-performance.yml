name: WFAG GPS performance validation

on:
  push:
    branches:
      - fix/wfag-gps-performance-2026-11-04
  pull_request:
    branches:
      - feature/wfag-v3-4-weekend-overtime-always
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test WFAG JavaScript and GPS invariants
        run: |
          for test in tests/*.test.js; do
            echo "Running $test"
            node "$test"
          done
      - name: Compile Android debug app
        run: gradle --no-daemon :app:assembleDebug
