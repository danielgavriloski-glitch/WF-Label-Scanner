name: WFAG GPS performance validation

on:
  push:
    branches:
      - fix/wfag-gps-performance-2026-11-04
  pull_request:
    branches:
      - feature/wfag-v3-4-weekend-overtime-always
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android API 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Run all WFAG JavaScript and GPS tests
        run: |
          for test in tests/*.test.js; do
            echo "Running $test"
            node "$test"
          done
      - name: Build separate GPS FIX test APK
        run: gradle --no-daemon :app:assembleGpsfix
      - uses: actions/upload-artifact@v4
        with:
          name: WFAG_GPS_FIX_TEST
          path: app/build/outputs/apk/gpsfix/app-gpsfix.apk
          if-no-files-found: error
      - name: Publish APK on isolated download branch
        if: github.event_name == 'push'
        run: |
          cp app/build/outputs/apk/gpsfix/app-gpsfix.apk /tmp/WFAG_GPS_FIX_TEST.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin downloads/wfag-gpsfix-test; then
            git switch --force-create downloads/wfag-gpsfix-test FETCH_HEAD
          else
            git checkout --orphan downloads/wfag-gpsfix-test
            git rm -rf . || true
          fi
          mkdir -p download
          cp /tmp/WFAG_GPS_FIX_TEST.apk download/WFAG_GPS_FIX_TEST.apk
          git add download/WFAG_GPS_FIX_TEST.apk
          git commit -m "build: WFAG GPS fix isolated test APK"
          git push origin HEAD:refs/heads/downloads/wfag-gpsfix-test
