name: Build TD Booking v6.2 Notifications
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-td-booking-v62.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danielgavriloski-glitch/td-album
          ref: main
          path: td
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Patch TD Booking notifications
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_admin.py
          echo '' | base64 -d > /tmp/AdminNotifyService.kt
          python /tmp/patch_admin.py
          cp /tmp/AdminNotifyService.kt td/github_source/admin/src/main/java/mk/td/booking/AdminNotifyService.kt
      - name: Build TD Booking APK
        working-directory: td/github_source
        run: gradle :admin:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TD-Booking-v6.2-NOTIFICATIONS-unsigned
          path: td/github_source/admin/build/outputs/apk/release/*.apk
