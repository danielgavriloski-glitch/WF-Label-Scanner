name: Build and verify MBI daily reports
on:
  push:
    branches: [mbi-v4-daily-reports]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APKs and verify report calculations
        run: gradle :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --stacktrace
      - name: Stage public signing tool for local private-key signing
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          jars = sorted((sdk/'build-tools').glob('*/lib/apksigner.jar'))
          if not jars: raise RuntimeError('apksigner.jar was not found')
          target = pathlib.Path('build/report-tools'); target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(jars[-1], target/'apksigner.jar')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MBI-v4.1-release-and-tests
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            build/report-tools/apksigner.jar
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Export examples with the real Android PDF renderer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.mbidesign.app.next.test/mk.wf.labelscanner.ReportPreviewInstrumentation
            mkdir -p build/report-previews
            adb pull /sdcard/Android/data/com.mbidesign.app.next/files/report-previews/ build/report-previews/
            test -s build/report-previews/report-previews/MBI_Izvestaj_Primer.pdf
            test -s build/report-previews/report-previews/MBI_Pdf_Layout_Stress.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: MBI-report-previews
          path: build/report-previews/report-previews/*
          if-no-files-found: error
