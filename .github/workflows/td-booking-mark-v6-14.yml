name: Build TD Booking MarK v6.14
on:
  push:
    branches: [td-booking-mark-v6-14]
    paths:
      - "td-booking-mark/**"
      - ".github/workflows/td-booking-mark-v6-14.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle -p td-booking-mark :admin:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TD_Booking_MarK_v6_14_DEBUG_NOT_UPDATE_SIGNED
          path: td-booking-mark/admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
