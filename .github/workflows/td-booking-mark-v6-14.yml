name: Build TD Booking MarK v6.14
on:
  push:
    branches: [td-booking-mark-v6-14]
    paths:
      - "td-booking-mark/**"
      - ".github/workflows/td-booking-mark-v6-14.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure SDK 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_BIN=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDK_BIN" || { echo "Android SDK manager missing"; exit 1; }
          yes | "$SDK_BIN" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDK_BIN" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle -p td-booking-mark :admin:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TD_Booking_MarK_v6_14_DEBUG_NOT_UPDATE_SIGNED
          path: td-booking-mark/admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
