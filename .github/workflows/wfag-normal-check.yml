name: WFAG normal update checks
on:
  push:
    branches:
      - fix/wfag-simple-hours-no-gps-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core attendance regression
        run: |
          node tests/core.test.js
          node tests/wfag-simple-hours.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install current Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore existing WFAG release signing key
        env:
          WFAG_SIGNING_BUNDLE: ${{ secrets.WFAG_SIGNING_BUNDLE }}
        run: |
          if [ -z "$WFAG_SIGNING_BUNDLE" ]; then
            echo "WFAG_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Existing WFAG signing key is not configured. Compilation can run, but no installable update will be published."
            exit 0
          fi
          umask 077
          mkdir -p signing
          printf '%s' "$WFAG_SIGNING_BUNDLE" | base64 -d > "$RUNNER_TEMP/wfag-signing.zip"
          unzip -q -o "$RUNNER_TEMP/wfag-signing.zip" signing/wfag-release.jks signing/signing.properties
          rm -f "$RUNNER_TEMP/wfag-signing.zip"
          test -f signing/wfag-release.jks
          test -f signing/signing.properties
          echo "WFAG_SIGNING_READY=true" >> "$GITHUB_ENV"
      - name: Compile and lint normal release
        run: gradle :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease -PwfagTestRunner=mk.workfashion.personal.BackupRestoreInstrumentation --no-daemon
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-wfag.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native backup restore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant mk.workfashion.personal android.permission.POST_NOTIFICATIONS
            adb logcat -c
            adb shell am instrument -w mk.workfashion.personal.test/mk.workfashion.personal.BackupRestoreInstrumentation > backup-validation.txt
            adb logcat -d > backup-runtime.txt
            cat backup-validation.txt
            grep WFAG_BACKUP_RESTORE_OK backup-validation.txt
      - name: Upload backup verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WFAG-3-5-1-native-backup-validation
          path: |
            backup-validation.txt
            backup-runtime.txt
          retention-days: 7
      - name: Prepare verified signed update
        if: env.WFAG_SIGNING_READY == 'true'
        run: |
          mkdir -p delivery
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='mk.workfashion.personal' versionCode='28'"
          cp "$APK" delivery/WFAG_3_5_1_BACKUP_FIX.apk
          sha256sum delivery/WFAG_3_5_1_BACKUP_FIX.apk > delivery/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: env.WFAG_SIGNING_READY == 'true'
        with:
          name: WFAG-3-5-1-UPDATE
          path: delivery/
          if-no-files-found: error
          retention-days: 7
      - name: Prepare unsigned release for local signing
        if: env.WFAG_SIGNING_READY != 'true'
        run: |
          mkdir -p unsigned-delivery/toolchain
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned-delivery/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" unsigned-delivery/toolchain/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" unsigned-delivery/toolchain/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" unsigned-delivery/toolchain/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" unsigned-delivery/toolchain/
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging unsigned-delivery/app-release-unsigned.apk | grep "package: name='mk.workfashion.personal' versionCode='28'"
          echo "::warning::Release compiled. Sign locally with the preserved WFAG key before distributing an installable update."
      - name: Upload unsigned compilation for local signing
        if: env.WFAG_SIGNING_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WFAG-3-5-1-UNSIGNED-COMPILATION-ONLY
          path: unsigned-delivery/
          if-no-files-found: error
          retention-days: 7
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WFAG-3-5-1-lint
          path: |
            app/build/reports/lint-results-release.html
            app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: rm -rf signing "$RUNNER_TEMP/wfag-signing.zip"
