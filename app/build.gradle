plugins { id 'com.android.application' }

def signingPropsFile = rootProject.file("signing/signing.properties")
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'mk.workfashion.personal'
    compileSdk 35
    defaultConfig {
        applicationId 'mk.workfashion.personal'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '2.9'
        testInstrumentationRunner 'mk.workfashion.personal.SmokeInstrumentation'
        manifestPlaceholders = [appLabel: 'Workfashion · Мои часови']
    }

    signingConfigs {
        if (signingPropsFile.exists()) {
            wfagRelease {
                storeFile rootProject.file("signing/" + signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        preview {
            initWith debug
            applicationIdSuffix '.preview2'
            versionNameSuffix '-preview2'
            manifestPlaceholders = [appLabel: 'WFAG Мапа · v2.9']
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            if (signingPropsFile.exists()) {
                signingConfig signingConfigs.wfagRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.mapsforge:mapsforge-map-android:0.25.0'
    implementation 'org.mapsforge:mapsforge-themes:0.25.0'
}

