plugins { id 'com.android.application' }

def signingPropsFile = rootProject.file("signing/signing.properties")
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'mk.workfashion.personal'
    compileSdk 35
    defaultConfig {
        applicationId 'mk.workfashion.personal'
        minSdk 26
        targetSdk 35
        versionCode 29
        versionName '3.6.0'
        testInstrumentationRunner 'mk.workfashion.personal.SmokeInstrumentation'
        manifestPlaceholders = [appLabel: 'Workfashion · Мои часови']
    }

    signingConfigs {
        if (signingPropsFile.exists()) {
            wfagRelease {
                storeFile rootProject.file("signing/" + signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        // The uploaded preview used an ephemeral debug certificate. Keep its data
        // accessible by installing this build alongside it, with ZIP import.
        pickups {
            initWith debug
            if (signingPropsFile.exists()) signingConfig signingConfigs.wfagRelease
            applicationIdSuffix '.pickups34'
            manifestPlaceholders = [appLabel: 'WFAG · Роба']
            matchingFallbacks = ['debug']
        }
        crafter {
            initWith debug
            if (signingPropsFile.exists()) signingConfig signingConfigs.wfagRelease
            applicationIdSuffix '.crafter3'
            versionNameSuffix '-test'
            manifestPlaceholders = [appLabel: 'WFAG Crafter TEST']
            matchingFallbacks = ['debug']
        }
        preview {
            initWith debug
            applicationIdSuffix '.preview2'
            versionNameSuffix '-preview2'
            manifestPlaceholders = [appLabel: 'WFAG Комбе · v3.0 TEST']
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            if (signingPropsFile.exists()) {
                signingConfig signingConfigs.wfagRelease
            }
        }
        // Separate installation for users whose old CI debug key was not retained.
        // CI produces an unsigned APK; a durable private key signs it outside Git.
        stable {
            initWith release
            signingConfig null
            applicationIdSuffix '.stable'
            manifestPlaceholders = [appLabel: 'WFAG']
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.mapsforge:mapsforge-map-android:0.25.0'
    implementation 'org.mapsforge:mapsforge-themes:0.25.0'
}

