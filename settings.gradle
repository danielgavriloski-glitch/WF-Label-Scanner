pluginManagement {
    repositories {
        google()
        // Google Cloud's documented mirror keeps the same Maven Central coordinates.
        // https://docs.cloud.google.com/docs/buildpacks/java#google_cloud_hosted_maven_central_mirror
        maven {
            name = 'GoogleHostedMavenCentral'
            url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven {
            name = 'GoogleHostedMavenCentral'
            url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
        }
        mavenCentral()
    }
}
rootProject.name = 'WorkfashionTime'
include ':app'
